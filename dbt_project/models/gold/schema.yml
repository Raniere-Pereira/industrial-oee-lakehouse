version: 2

models:
  - name: dim_machine
    description: "Dimensão limpa de máquinas industriais com surrogate key SHA-256."
    columns:
      - name: machine_sk
        description: "Chave substituta determinística (SHA-256) da máquina."
        tests:
          - not_null
          - unique
      - name: machine_name
        description: "Nome padronizado da máquina (sem espaços extras)."
        tests:
          - not_null
          - unique

  - name: dim_product
    description: "Dimensão limpa de produtos com surrogate key SHA-256 e correção do typo biscuits_per_pallet."
    columns:
      - name: product_sk
        description: "Chave substituta determinística (SHA-256) do produto."
        tests:
          - not_null
          - unique
      - name: product_name
        description: "Nome padronizado do produto."
        tests:
          - not_null
          - unique

  - name: fct_oee_daily
    description: >
      Tabela fato diária de OEE no grão event_date + machine_sk + product_sk com arquitetura Dual-Lens:
      (1) Visão Estrita MES (rótulo literal de oee_category segundo ISO 22400) e
      (2) Visão Efetiva por Telemetria PLC (baseada na prova física de que 93,9% da produção líquida ocorre em NO_ORDER).
    columns:
      - name: event_date
        description: "Data do evento de produção."
        tests:
          - not_null
      - name: machine_sk
        description: "Chave estrangeira para dim_machine."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_machine')
                field: machine_sk
      - name: product_sk
        description: "Chave estrangeira para dim_product."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_sk
      - name: good_counter_mode
        description: "Modo do contador de biscoitos bons da máquina (CUMULATIVE_ODOMETER ou PER_EVENT_INCREMENTAL)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CUMULATIVE_ODOMETER', 'PER_EVENT_INCREMENTAL']
      - name: total_duration_minutes
        description: "Duração total registrada no dia/máquina/produto (minutos)."
        tests:
          - not_null
      - name: planned_production_minutes
        description: "[Visão Estrita MES] Tempo programado de produção (total_duration_minutes - no_order_minutes)."
        tests:
          - not_null
      - name: no_order_minutes
        description: "[Visão Estrita MES] Tempo rotulado como NO_ORDER, excluído do Planned Production Time literal."
        tests:
          - not_null
      - name: maintenance_minutes
        description: "[Visão Estrita MES] Tempo em manutenção (MAINTENANCE)."
        tests:
          - not_null
      - name: changeover_minutes
        description: "[Visão Estrita MES] Tempo em setup/limpeza (CHANGEOVER)."
        tests:
          - not_null
      - name: explicit_run_time_minutes
        description: "[Visão Estrita MES] Tempo com rótulo literal RUN_TIME na origem."
        tests:
          - not_null
      - name: unclassified_minutes
        description: "[Visão Estrita MES] Tempo em eventos sem classificação de categoria (UNCLASSIFIED)."
        tests:
          - not_null
      - name: counter_reset_count
        description: "Quantidade de resets reais de contador PLC (< 50%) detectados no dia."
        tests:
          - not_null
      - name: counter_jitter_count
        description: "Quantidade de eventos de micro-queda/jitter de sensor (50%..100%) filtrados no dia."
        tests:
          - not_null
      - name: availability_rate
        description: "[Visão Estrita MES] Disponibilidade literal (explicit_run_time_minutes / planned_production_minutes); NULL se planned_production_minutes <= 0."
      - name: performance_rate
        description: "[Visão Estrita MES] Performance literal (LEAST(1.0, delta_total_biscuits_made / expected_biscuits)); NULL sem Run Time explícito ou sem telemetria."
      - name: quality_rate
        description: "[Compartilhado] Qualidade física (LEAST(1.0, delta_good_biscuits_made / delta_total_biscuits_made)); NULL sem telemetria válida de contador total."
      - name: oee_score
        description: "[Visão Estrita MES] OEE literal (availability_rate * performance_rate * quality_rate); NULL quando qualquer pilar não possui telemetria confiável."
      - name: effective_run_time_minutes
        description: "[Visão Efetiva Telemetria] Minutos de operação efetiva inferida via telemetria física (eventos NO_ORDER, onde ocorre 93,9% do avanço do odômetro)."
        tests:
          - not_null
      - name: effective_run_time_telemetry_minutes
        description: "[Visão Efetiva Telemetria] Minutos em NO_ORDER com telemetria ativa de contador total (has_total_counter_telemetry = TRUE)."
        tests:
          - not_null
      - name: delta_total_biscuits_effective_run
        description: "[Visão Efetiva Telemetria] Delta líquido de biscoitos produzidos durante NO_ORDER com telemetria ativa; NULL quando não há telemetria no grupo."
      - name: expected_biscuits_effective
        description: "[Visão Efetiva Telemetria] Produção teórica esperada em NO_ORDER com telemetria ativa ((duration_minutes / 60.0) * target_biscuits_per_hour) para ponderação em BI."
        tests:
          - not_null
      - name: availability_rate_effective
        description: "[Visão Efetiva Telemetria] Disponibilidade efetiva (effective_run_time_minutes / total_duration_minutes); NULL se total_duration_minutes <= 0."
      - name: performance_rate_effective
        description: "[Visão Efetiva Telemetria] Performance efetiva (LEAST(1.0, delta_total_biscuits_effective_run / expected_biscuits_effective)); NULL sem telemetria ou base esperada."
      - name: oee_score_effective
        description: "[Visão Efetiva Telemetria] OEE efetivo (availability_rate_effective * performance_rate_effective * quality_rate); NULL quando qualquer pilar não possui telemetria."
