version: 2

models:
  - name: dim_machine
    description: "Dimensão limpa de máquinas industriais com surrogate key SHA-256."
    columns:
      - name: machine_sk
        description: "Chave substituta determinística (SHA-256) da máquina."
        tests:
          - not_null
          - unique
      - name: machine_name
        description: "Nome padronizado da máquina (sem espaços extras)."
        tests:
          - not_null
          - unique

  - name: dim_product
    description: "Dimensão limpa de produtos com surrogate key SHA-256 e correção do typo biscuits_per_pallet."
    columns:
      - name: product_sk
        description: "Chave substituta determinística (SHA-256) do produto."
        tests:
          - not_null
          - unique
      - name: product_name
        description: "Nome padronizado do produto."
        tests:
          - not_null
          - unique

  - name: fct_oee_daily
    description: "Tabela fato diária de OEE no grão event_date + machine_sk + product_sk com decomposição aditiva ISO 22400 e deltas de odômetro via High-Water Mark."
    columns:
      - name: event_date
        description: "Data do evento de produção."
        tests:
          - not_null
      - name: machine_sk
        description: "Chave estrangeira para dim_machine."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_machine')
                field: machine_sk
      - name: product_sk
        description: "Chave estrangeira para dim_product."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_sk
      - name: good_counter_mode
        description: "Modo do contador de biscoitos bons da máquina (CUMULATIVE_ODOMETER ou PER_EVENT_INCREMENTAL)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CUMULATIVE_ODOMETER', 'PER_EVENT_INCREMENTAL']
      - name: total_duration_minutes
        description: "Duração total registrada no dia/máquina/produto (minutos)."
        tests:
          - not_null
      - name: planned_production_minutes
        description: "Tempo programado de produção (total_duration_minutes - no_order_minutes)."
        tests:
          - not_null
      - name: no_order_minutes
        description: "Tempo sem ordem de produção (NO_ORDER), excluído do Planned Production Time."
        tests:
          - not_null
      - name: maintenance_minutes
        description: "Tempo em manutenção (MAINTENANCE)."
        tests:
          - not_null
      - name: changeover_minutes
        description: "Tempo em setup/limpeza (CHANGEOVER)."
        tests:
          - not_null
      - name: explicit_run_time_minutes
        description: "Tempo produtivo explícito (RUN_TIME)."
        tests:
          - not_null
      - name: unclassified_minutes
        description: "Tempo em eventos sem classificação de categoria (UNCLASSIFIED)."
        tests:
          - not_null
      - name: counter_reset_count
        description: "Quantidade de resets reais de contador PLC (< 50%) detectados no dia."
        tests:
          - not_null
      - name: counter_jitter_count
        description: "Quantidade de eventos de micro-queda/jitter de sensor (50%..100%) filtrados no dia."
        tests:
          - not_null
      - name: availability_rate
        description: "Taxa de disponibilidade (explicit_run_time_minutes / planned_production_minutes); NULL quando planned_production_minutes <= 0."
      - name: performance_rate
        description: "Taxa de performance (LEAST(1.0, delta_total_biscuits_made / expected_biscuits)); NULL sem Run Time ou sem telemetria de contador."
      - name: quality_rate
        description: "Taxa de qualidade (LEAST(1.0, delta_good_biscuits_made / delta_total_biscuits_made)); NULL sem telemetria válida de contador total."
      - name: oee_score
        description: "Índice OEE diário (availability_rate * performance_rate * quality_rate); NULL quando qualquer pilar não possui telemetria confiável."
